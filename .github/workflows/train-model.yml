name: Train Fruit Classifier

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install training dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-train.txt

      - name: Download and prepare Fruits-360 dataset
        run: python scripts/prepare_dataset.py

      - name: Train CNN model
        run: python train.py

      - name: Upload trained model and results
        uses: actions/upload-artifact@v4
        with:
          name: fruit-classifier-model
          path: |
            models/*.keras
            models/class_names.json
            results/*
          if-no-files-found: error
