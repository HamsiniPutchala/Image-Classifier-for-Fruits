name: Train Fruit Classifier

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/prepare_dataset.py'
      - 'train.py'
      - 'evaluate.py'
      - '.github/workflows/train-model.yml'

permissions:
  contents: write

concurrency:
  group: fruit-classifier-training
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-train.txt

      - name: Verify Python and dependencies
        run: |
          python --version
          python -c "import tensorflow, numpy, pandas, matplotlib, seaborn, sklearn, PIL, kagglehub; print('All training dependencies imported successfully')"

      - name: Replace Lemon references with Lime
        run: |
          sed -i 's/Lemon/Lime/g' app.py README.md models/README.md

      - name: Download and prepare Fruits-360 dataset
        run: python scripts/prepare_dataset.py

      - name: Verify prepared 10-class dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          classes = [
              'Apple', 'Banana', 'Grape', 'Kiwi', 'Lime',
              'Mango', 'Orange', 'Pineapple', 'Strawberry', 'Watermelon'
          ]
          for split in ['train', 'validation']:
              for cls in classes:
                  path = Path('dataset') / split / cls
                  count = len(list(path.glob('*'))) if path.exists() else 0
                  print(f'{split}/{cls}: {count} files')
                  if count == 0:
                      raise SystemExit(f'Missing dataset files in {path}')
          print(f'Verified {len(classes)} fruit classes')
          PY

      - name: Train MobileNetV2 model
        run: python train.py

      - name: Verify trained model and metadata
        run: |
          test -s models/best_model.keras
          test -s models/fruit_classifier.keras
          test -s models/class_names.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = [
              'Apple', 'Banana', 'Grape', 'Kiwi', 'Lime',
              'Mango', 'Orange', 'Pineapple', 'Strawberry', 'Watermelon'
          ]
          with open('models/class_names.json', encoding='utf-8') as f:
              classes = json.load(f)
          assert classes == expected, classes
          model_size_mb = Path('models/best_model.keras').stat().st_size / (1024 * 1024)
          print(f'Classes: {classes}')
          print(f'Best model size: {model_size_mb:.2f} MB')
          if model_size_mb >= 95:
              raise SystemExit('best_model.keras is too large for normal GitHub repository storage')
          PY

      - name: Evaluate model
        run: python evaluate.py

      - name: Upload trained model and results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fruit-classifier-model
          path: |
            models/*.keras
            models/class_names.json
            results/*
          if-no-files-found: error

      - name: Publish model, metadata and Lime documentation
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app.py README.md models/README.md models/best_model.keras models/class_names.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Replace Lemon with Lime in 10-class classifier"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
