name: Train Fruit Classifier

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/prepare_dataset.py'
      - 'train.py'
      - 'evaluate.py'
      - '.github/workflows/train-model.yml'

permissions:
  contents: write

concurrency:
  group: fruit-classifier-training
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-train.txt

      - name: Verify Python and dependencies
        run: |
          python --version
          python -c "import tensorflow, numpy, pandas, matplotlib, seaborn, sklearn, PIL, kagglehub; print('All training dependencies imported successfully')"

      - name: Synchronize app metadata for Blackberry
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '"Apple", "Banana", "Grape", "Kiwi", "Lemon",\n    "Mango", "Orange", "Pineapple", "Strawberry", "Watermelon",',
              '"Apple", "Banana", "Blackberry", "Grape", "Kiwi",\n    "Mango", "Orange", "Pineapple", "Strawberry", "Watermelon",',
          )
          text = text.replace(
              '"Apple", "Banana", "Lemon", "Mango", "Orange", "Pineapple", "Strawberry", "Watermelon"',
              '"Apple", "Banana", "Mango", "Orange", "Pineapple", "Strawberry", "Watermelon"',
          )
          text = text.replace(
              'predicted_class in {"Banana", "Lemon"}',
              'predicted_class == "Banana"',
          )
          text = text.replace('"Lemon": "🍋"', '"Blackberry": "🫐"')
          path.write_text(text, encoding='utf-8')
          PY
          grep -n "Blackberry" app.py
          if grep -n "Lemon" app.py; then
            echo "Unexpected Lemon reference remains in app.py"
            exit 1
          fi

      - name: Prepare and verify 10-class dataset
        run: |
          python scripts/prepare_dataset.py
          python - <<'PY'
          from pathlib import Path
          classes = [
              'Apple', 'Banana', 'Blackberry', 'Grape', 'Kiwi',
              'Mango', 'Orange', 'Pineapple', 'Strawberry', 'Watermelon'
          ]
          for split in ['train', 'validation']:
              for cls in classes:
                  path = Path('dataset') / split / cls
                  files = [p for p in path.iterdir() if p.is_file()] if path.exists() else []
                  print(f'{split}/{cls}: {len(files)} files')
                  expected = 450 if split == 'train' else 100
                  if len(files) != expected:
                      raise SystemExit(f'Expected {expected} files in {path}, found {len(files)}')
          print(f'Verified balanced dataset: {len(classes)} classes, 450 train + 100 validation images per class')
          PY

      - name: Train MobileNetV2 model
        run: python train.py

      - name: Verify trained model and metadata
        run: |
          test -s models/best_model.keras
          test -s models/fruit_classifier.keras
          test -s models/class_names.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = [
              'Apple', 'Banana', 'Blackberry', 'Grape', 'Kiwi',
              'Mango', 'Orange', 'Pineapple', 'Strawberry', 'Watermelon'
          ]
          with open('models/class_names.json', encoding='utf-8') as f:
              classes = json.load(f)
          assert classes == expected, classes
          model_size_mb = Path('models/best_model.keras').stat().st_size / (1024 * 1024)
          print(f'Classes: {classes}')
          print(f'Best model size: {model_size_mb:.2f} MB')
          if model_size_mb >= 95:
              raise SystemExit('best_model.keras is too large for normal GitHub repository storage')
          PY

      - name: Evaluate model
        run: python evaluate.py

      - name: Upload trained model and results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fruit-classifier-model
          path: |
            models/*.keras
            models/class_names.json
            results/*
          if-no-files-found: error

      - name: Publish trained model, app and metadata
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py scripts/prepare_dataset.py models/best_model.keras models/fruit_classifier.keras models/class_names.json results
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -m "Train 10-class fruit classifier"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
