name: Train Fruit Classifier

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/prepare_dataset.py'
      - 'train.py'
      - 'utils/**'
      - 'evaluate.py'
      - 'app.py'
      - '.github/workflows/train-model.yml'

permissions:
  contents: write

concurrency:
  group: fruit-classifier-training
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-train.txt
      - name: Verify dependencies
        run: python -c "import tensorflow, numpy, pandas, matplotlib, seaborn, sklearn, PIL, kagglehub; print('Dependencies OK')"
      - name: Prepare complete 10-class dataset
        run: python scripts/prepare_dataset.py
      - name: Verify dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          classes = ['Apple','Banana','Blackberry','Grape','Kiwi','Mango','Orange','Pineapple','Strawberry','Watermelon']
          for split in ['train','validation']:
              for cls in classes:
                  path = Path('dataset') / split / cls
                  files = [p for p in path.iterdir() if p.is_file()] if path.exists() else []
                  if not files: raise SystemExit(f'Missing images: {path}')
                  print(f'{split}/{cls}: {len(files)}')
          PY
      - name: Train and evaluate
        run: |
          python train.py
          python evaluate.py
      - name: Verify outputs
        run: |
          test -s models/best_model.keras
          test -s models/fruit_classifier.keras
          test -s models/class_names.json
          test -s models/ood_calibration.npz
          python - <<'PY'
          import json, numpy as np
          expected = ['Apple','Banana','Blackberry','Grape','Kiwi','Mango','Orange','Pineapple','Strawberry','Watermelon']
          with open('models/class_names.json', encoding='utf-8') as f: classes = json.load(f)
          assert classes == expected
          data = np.load('models/ood_calibration.npz')
          assert data['centroids'].shape[0] == 10
          assert len(data['distance_thresholds']) == 10
          print('All 10 classes and OOD calibration verified')
          PY
      - name: Upload model and results
        uses: actions/upload-artifact@v4
        with:
          name: fruit-classifier-model
          path: |
            models/*.keras
            models/class_names.json
            models/ood_calibration.npz
            results/*
          if-no-files-found: error
      - name: Publish model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/best_model.keras models/fruit_classifier.keras models/class_names.json models/ood_calibration.npz
          if git diff --cached --quiet; then echo "No model changes"; else git commit -m "Publish improved fruit classifier" && git push origin HEAD:main; fi
